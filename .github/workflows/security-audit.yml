name: "Security Vulnerability Audit"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 12 * * 1" # Runs every Monday at 12:00 UTC

permissions:
  contents: read

jobs:
  # 1. SCA JOB: Checks third-party dependencies on Pull Requests
  dependency-review:
    name: Dependency Review (SCA)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # Only runs on PRs
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail the build if critical or high vulnerabilities are found
          fail-on-severity: critical, high
          # Block licenses that might cause legal trouble (optional example)
          # allow-licenses: MIT, Apache-2.0, BSD-3-Clause

  # 2. SAST JOB: Analyzes custom source code for security flaws
  codeql-analysis:
    name: CodeQL Static Analysis (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Required to upload results to the Security tab

    strategy:
      fail-fast: false
      matrix:
        # Supported languages: 'javascript-typescript', 'python', 'go', 'java-kotlin', 'ruby', 'c-cpp', 'csharp'
        # Adapt this list to match your workshop's language
        language: ["javascript-typescript"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # 'security-extended' adds extra security queries beyond the default suite
          queries: security-extended

      # Note: For compiled languages (Java, C#, C++), you would need an autobuild/build step here.
      - name: Autobuild (If needed)
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
